<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apr 2018 Case Study</title>

<link rel="stylesheet" href="./leaflet.css"/>
<script src="./leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet-velocity@2.1.4/dist/leaflet-velocity.css"/>
<script src="https://unpkg.com/leaflet-velocity@2.1.4/dist/leaflet-velocity.js"></script>

<style>
  html, body { height:100%; margin:0; }
  #map { height:100%; background:#fff; }

  /* left control panel */
  .panel{
    position:absolute; top:64px; left:14px; z-index:9999;
    background:rgba(255,255,255,0.95);
    border:1px solid #cfd7df; border-radius:14px;
    padding:12px 12px;
    font:600 12px/1.25 Arial, sans-serif;
    box-shadow: 0 2px 12px rgba(0,0,0,.10);
    min-width: 340px;
  }
  .row{ display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .btn{
    border:1px solid #1b2c3a; background:#fff; border-radius:12px;
    padding:7px 11px; cursor:pointer; font:800 12px Arial;
  }
  .btn:active{ transform: translateY(1px); }
  .mono{ font-family: ui-monospace, Menlo, Consolas, monospace; font-weight:800; }
  .tiny { font:600 11px/1.2 Arial, sans-serif; opacity:.78; }

  /* right toggle box */
  .toggles{
    position:absolute; top:64px; right:14px; z-index:9999;
    background:rgba(255,255,255,0.95);
    border:1px solid #cfd7df; border-radius:14px;
    padding:10px 12px;
    font:700 12px/1.35 Arial, sans-serif;
    box-shadow: 0 2px 12px rgba(0,0,0,.10);
    min-width: 230px;
  }
  .toggles label{ display:flex; align-items:center; gap:8px; margin:6px 0; }
  .toggles input{ transform: scale(1.05); }

  /* banner styled to match logo colors (navy + gold accent) */
  .tvbanner{
    position:absolute;
    top:0; left:0; right:0;
    z-index:100000;
    background:rgba(14,34,52,0.94);
    color:#fff;
    font:900 18px/1.2 Arial, sans-serif;
    letter-spacing:0.6px;
    padding:12px 16px;
    border-bottom:3px solid rgba(243,156,18,0.85);
    text-transform:uppercase;
    pointer-events:none;
  }

  /* bottom-left legend card */
  .legend{
    position:absolute;
    left:14px;
    bottom:18px;
    z-index:9999;
    background:rgba(255,255,255,0.95);
    border:1px solid #cfd7df;
    border-radius:14px;
    padding:10px 12px;
    font:800 12px/1.25 Arial, sans-serif;
    min-width:220px;
    box-shadow: 0 2px 12px rgba(0,0,0,.10);
    display:none;
  }

  /* logo */
  #brandLogo{
    position:absolute;
    bottom:10px;
    right:10px;
    z-index:100000;
    width:120px;
    max-width:22vw;
    height:auto;
    opacity:0.92;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
    pointer-events:none;
  }

  /* metar dot */
  .dot{
    border-radius:50%;
    border:2px solid rgba(0,0,0,0.75);
    display:flex;align-items:center;justify-content:center;
    font:900 12px/1 Arial, sans-serif;color:#111;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
    user-select:none;
    background:#fff;
  }

  /* brighten observed radar a touch */
  .obs-radar { filter: brightness(1.18) contrast(1.06); }
</style>
</head>

<body>
<div id="map"></div>
<div id="banner" class="tvbanner">Apr 2018 Case Study</div>
<div id="legend" class="legend"></div>

<img id="brandLogo" alt="Weather Workshops" src="./logo.png"/>

<div class="panel">
  <div style="font-size:13px;margin-bottom:6px">Apr 2018 Case Study</div>

  <div class="row">
    <button class="btn" id="backBtn">◀ Time</button>
    <div class="mono" id="timeLabel">2018-04-14 15Z</div>
    <button class="btn" id="fwdBtn">Time ▶</button>
  </div>

  <div class="row">
    <span class="tiny">Particles day:</span>
    <button class="btn" id="dayBackBtn">◀ Apr 13</button>
    <div class="mono" id="dayLabel">Apr 14</div>
    <button class="btn" id="dayFwdBtn">Apr 15 ▶</button>
  </div>

  <div class="row">
    <span style="opacity:.75">Step:</span>
    <span class="mono">3 hours</span>
    <span style="opacity:.75;margin-left:auto">Zoom:</span>
    <span class="mono" id="zoomLabel">6</span>
  </div>

  <div class="row"><span class="tiny" id="status">Loading…</span></div>
  <div class="tiny">Wind arrows: direction wind is blowing <b>TO</b> (METAR direction + 180°).</div>
</div>

<div class="toggles" id="toggleBox">
  <div style="font:900 12px Arial; opacity:.9; margin-bottom:6px;">Layers</div>
  <label><input type="checkbox" id="layer_temp" checked> Temperature (°F)</label>
  <label><input type="checkbox" id="layer_alerts"> Alerts (WWA)</label>
  <label><input type="checkbox" id="layer_obsradar"> Composite Radar (Observed)</label>
  <label><input type="checkbox" id="layer_hrrr_refd"> Radar (HRRR REFD)</label>
  <label><input type="checkbox" id="layer_hrrr_repf"> Precip Type (HRRR REFP)</label>
</div>

<script>
/* ---------------------------
   1) Map + basemap
--------------------------- */
const map = L.map('map', { preferCanvas:true }).setView([43.6, -96.7], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);

const statusEl = document.getElementById('status');
const timeLabel = document.getElementById('timeLabel');
const dayLabel = document.getElementById('dayLabel');
const zoomLabel = document.getElementById('zoomLabel');
const banner = document.getElementById('banner');
const legend = document.getElementById('legend');

map.on('zoomend', () => zoomLabel.textContent = map.getZoom());

/* ---------------------------
   2) Time handling (3-hour)
--------------------------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtYYYYMMDD(d){ return `${d.getUTCFullYear()}${pad2(d.getUTCMonth()+1)}${pad2(d.getUTCDate())}`; }
function fmtISOZ(d){
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}Z`;
}
// start at 2018-04-14 15Z
let t = new Date(Date.UTC(2018,3,14,15,0,0));
const STEP_HOURS = 3;

function addHours(dt, h){
  return new Date(dt.getTime() + h*3600*1000);
}

/* ---------------------------
   3) Color scale (temp)
--------------------------- */
function lerp(a,b,x){ return a + (b-a)*x; }
function rgb(r,g,b){ return `rgb(${r|0},${g|0},${b|0})`; }
// simple blue->green->yellow->orange
function tempColorF(tf){
  if (tf == null || isNaN(tf)) return '#999';
  const t = tf;
  if (t <= 10) return rgb(40,120,255);
  if (t <= 30){
    const x=(t-10)/20;
    return rgb(lerp(40,70,x), lerp(120,200,x), lerp(255,255,x));
  }
  if (t <= 50){
    const x=(t-30)/20;
    return rgb(lerp(70,20,x), lerp(200,220,x), lerp(255,60,x));
  }
  if (t <= 70){
    const x=(t-50)/20;
    return rgb(lerp(20,255,x), lerp(220,150,x), lerp(60,0,x));
  }
  return rgb(255, 110, 0);
}

/* ---------------------------
   4) METARs (IEM asos.py)
   - Fetch all, then filter to map bounds
   - Downsample when zoomed out
--------------------------- */
const metarLayer = L.layerGroup().addTo(map);

// Keep it simple: pull a broad set of networks; filter by bounds after.
// (You can add/remove as you like.)
const NETWORKS = [
  "SD_ASOS","MN_ASOS","IA_ASOS","NE_ASOS","ND_ASOS","KS_ASOS","MO_ASOS","WI_ASOS","IL_ASOS"
];

function asosURL(dateUTC){
  // yyyy mm dd hh mm
  const y = dateUTC.getUTCFullYear();
  const mo = pad2(dateUTC.getUTCMonth()+1);
  const da = pad2(dateUTC.getUTCDate());
  const hh = pad2(dateUTC.getUTCHours());
  const mi = pad2(dateUTC.getUTCMinutes());
  const params = new URLSearchParams({
    data: "tmpf,drct,sknt,gust,vsby",
    year1: y, month1: mo, day1: da, hour1: hh, minute1: mi,
    year2: y, month2: mo, day2: da, hour2: hh, minute2: mi,
    tz: "UTC",
    format: "comma",
    latlon: "yes",
    missing: "M",
    trace: "0",
    direct: "yes"
  });
  // one network param per line
  NETWORKS.forEach(n => params.append("network", n));
  return `https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?${params.toString()}`;
}

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = lines[0].split(",").map(s=>s.trim());
  const idx = Object.fromEntries(headers.map((h,i)=>[h,i]));
  const out = [];
  for (let i=1;i<lines.length;i++){
    const cols = lines[i].split(",");
    const lat = parseFloat(cols[idx.lat]);
    const lon = parseFloat(cols[idx.lon]);
    if (!isFinite(lat) || !isFinite(lon)) continue;
    const tmpf = parseFloat(cols[idx.tmpf]);
    const drct = parseFloat(cols[idx.drct]);
    const sknt = parseFloat(cols[idx.sknt]);
    out.push({lat, lon, tmpf, drct, sknt});
  }
  return out;
}

function downsample(points, maxCount){
  if (points.length <= maxCount) return points;
  const step = Math.ceil(points.length / maxCount);
  const out = [];
  for (let i=0;i<points.length;i+=step) out.push(points[i]);
  return out;
}

function renderMETARs(rows){
  metarLayer.clearLayers();
  const z = map.getZoom();
  const b = map.getBounds().pad(0.20);

  // filter to current view to reduce clutter, BUT ensure Sioux Falls stays in view when you zoom.
  let pts = rows.filter(r => b.contains([r.lat, r.lon]));

  // if zoomed out really far and bounds include lots of stations, cap hard
  let cap = 350;
  if (z >= 6) cap = 700;
  if (z >= 7) cap = 1200;
  if (z <= 4) cap = 220;

  pts = downsample(pts, cap);

  pts.forEach(r=>{
    const tf = r.tmpf;
    const c = tempColorF(tf);
    const size = (z <= 4) ? 20 : (z === 5 ? 24 : 28);
    const icon = L.divIcon({
      className: "",
      html: `<div class="dot" style="width:${size}px;height:${size}px;background:${c}">${isFinite(tf)?Math.round(tf):""}</div>`,
      iconSize: [size,size],
      iconAnchor:[size/2,size/2]
    });
    const m = L.marker([r.lat, r.lon], {icon});
    m.bindTooltip(`Temp: ${isFinite(tf)?tf.toFixed(0):"M"}°F<br>Wind: ${isFinite(r.drct)?r.drct.toFixed(0):"M"}° / ${isFinite(r.sknt)?r.sknt.toFixed(0):"M"} kt`, {sticky:true});
    metarLayer.addLayer(m);
  });

  statusEl.textContent = `Stations shown: ${pts.length}/${rows.length} (zoom ${z})`;
}

async function loadMETARs(){
  const url = asosURL(t);
  const resp = await fetch(url, {cache:"no-store"});
  if (!resp.ok) throw new Error(`METAR HTTP ${resp.status}`);
  const rows = parseCSV(await resp.text());
  renderMETARs(rows);
}

/* ---------------------------
   5) Alerts (GeoJSON)
   - expects: timeline_hourly/alerts_YYYYMMDD_HHMMZ.geojson
   - if you only have hourly, HH00 is fine
--------------------------- */
const alertsLayer = L.geoJSON(null, {
  style: f => {
    const ev = (f.properties && (f.properties.event || f.properties.phenomena)) || "";
    // Focus only on flood / severe / tornado, skip anything else (including "purple fy.y")
    const name = String(ev);
    let color = null;
    if (/tornado/i.test(name)) color = "#ff0000";
    else if (/severe/i.test(name)) color = "#ffd700";
    else if (/flash flood/i.test(name)) color = "#00ff00";
    else if (/flood/i.test(name)) color = "#00a9ff";
    else return {color:"#000", weight:0, fillOpacity:0}; // essentially hidden
    return {color, weight:2, fillOpacity:0.15};
  },
  onEachFeature: (f, layer) => {
    const p = f.properties || {};
    const title = p.event || p.phenomena || "Alert";
    const desc = p.description || p.headline || "";
    layer.bindPopup(`<b>${title}</b><br><div style="max-width:340px">${desc}</div>`);
  }
});

async function fetchFirstOK(urls){
  for (const u of urls){
    const r = await fetch(u, {cache:"no-store"});
    if (r.ok) return {url:u, resp:r};
  }
  return null;
}

async function loadAlerts(){
  alertsLayer.clearLayers();
  const ymd = fmtYYYYMMDD(t);
  const hh = pad2(t.getUTCHours());
  const mm = pad2(t.getUTCMinutes());
  const candidates = [
    `timeline_hourly/alerts_${ymd}_${hh}${mm}Z.geojson`,
    `timeline_hourly/alerts_${ymd}_${hh}00Z.geojson`
  ];
  const hit = await fetchFirstOK(candidates);
  if (!hit){
    statusEl.textContent += " • Alerts: none";
    return;
  }
  const gj = await hit.resp.json();
  alertsLayer.addData(gj);
  statusEl.textContent += ` • Alerts: loaded (${hit.url})`;
}

/* ---------------------------
   6) Observed composite radar
   - expects: radar_frames/n0q_YYYYMMDDHH00.png
   - uses bounds from radar_frames/radar_bounds.json if present
--------------------------- */
let radarBounds = null;
let obsRadarOverlay = null;

async function loadRadarBounds(){
  // optional; if missing, use a reasonable default for IEM mosaics
  const resp = await fetch("radar_frames/radar_bounds.json", {cache:"no-store"});
  if (resp.ok){
    const j = await resp.json();
    // accept either {north,south,east,west} or [[S,W],[N,E]]
    if (Array.isArray(j) && j.length===2) return L.latLngBounds([j[0][0], j[0][1]], [j[1][0], j[1][1]]);
    if (j && isFinite(j.south) && isFinite(j.west) && isFinite(j.north) && isFinite(j.east)){
      return L.latLngBounds([j.south, j.west], [j.north, j.east]);
    }
  }
  // Default from IEM doc worldfile (your numbers): x=-126.., y=50.., pixel 0.005
  // This corresponds roughly to S=20, N=50, W=-126, E=-66.
  return L.latLngBounds([20, -126], [50, -66]);
}

function radarFileForTime(dateUTC){
  // 3-hour step, use HH00
  const ymd = fmtYYYYMMDD(dateUTC);
  const hh = pad2(dateUTC.getUTCHours());
  return `radar_frames/n0q_${ymd}${hh}00.png`;
}

async function loadObsRadar(){
  if (!radarBounds) radarBounds = await loadRadarBounds();

  const url = radarFileForTime(t);
  const check = await fetch(url, {cache:"no-store"});
  if (!check.ok){
    statusEl.textContent += ` • Obs radar: missing (${url})`;
    if (obsRadarOverlay){ map.removeLayer(obsRadarOverlay); obsRadarOverlay=null; }
    return;
  }

  // rebuild overlay (simple + reliable)
  if (obsRadarOverlay) map.removeLayer(obsRadarOverlay);
  obsRadarOverlay = L.imageOverlay(url, radarBounds, {opacity:0.75, className:"obs-radar"});
  if (document.getElementById("layer_obsradar").checked) obsRadarOverlay.addTo(map);
  statusEl.textContent += ` • Obs radar: ${url}`;
}

/* ---------------------------
   7) HRRR layers (optional)
   - keep your existing tiles if you have them; otherwise harmless.
--------------------------- */
let hrrrREFD = null;
let hrrrREFP = null;

function ensureHRRRLayers(){
  // These URLs are placeholders; if your previous HRRR tile service is down, leave off.
  // You can wire these to your own tiles later.
  if (!hrrrREFD){
    hrrrREFD = L.tileLayer('', {opacity:0.65}); // empty
  }
  if (!hrrrREFP){
    hrrrREFP = L.tileLayer('', {opacity:0.65});
  }
}

/* ---------------------------
   8) UI wiring
--------------------------- */
function updateBanner(){
  const parts = [];
  if (document.getElementById("layer_alerts").checked) parts.push("WEATHER ALERTS");
  if (document.getElementById("layer_obsradar").checked) parts.push(`COMPOSITE RADAR (OBS) — ${fmtISOZ(t)}`);
  if (document.getElementById("layer_temp").checked && parts.length===0) parts.push(`SURFACE TEMPERATURES — ${fmtISOZ(t)}`);
  if (parts.length===0) parts.push(`APR 2018 CASE STUDY — ${fmtISOZ(t)}`);
  banner.textContent = parts[0];
}

function setLegend(show){
  if (!show){ legend.style.display="none"; return; }
  legend.style.display="block";
  legend.innerHTML = `<div style="font:900 12px Arial;margin-bottom:6px">Temperature (°F)</div>
    <div class="tiny">Colored station dots (auto-thinned when zoomed out).</div>`;
}

async function refreshAll(){
  timeLabel.textContent = fmtISOZ(t);
  updateBanner();

  const wantsTemp = document.getElementById("layer_temp").checked;
  const wantsAlerts = document.getElementById("layer_alerts").checked;
  const wantsObs = document.getElementById("layer_obsradar").checked;

  // METARs
  try{
    if (wantsTemp){
      await loadMETARs();
      metarLayer.addTo(map);
      setLegend(true);
    }else{
      metarLayer.clearLayers();
      map.removeLayer(metarLayer);
      setLegend(false);
    }
  }catch(e){
    console.error(e);
    statusEl.textContent = `METAR error: ${e.message}`;
  }

  // Alerts
  try{
    if (wantsAlerts){
      await loadAlerts();
      alertsLayer.addTo(map);
    }else{
      alertsLayer.clearLayers();
      map.removeLayer(alertsLayer);
    }
  }catch(e){
    console.error(e);
    statusEl.textContent += ` • Alerts error`;
  }

  // Obs radar
  try{
    if (wantsObs){
      await loadObsRadar();
    }else{
      if (obsRadarOverlay){ map.removeLayer(obsRadarOverlay); }
    }
  }catch(e){
    console.error(e);
    statusEl.textContent += ` • Radar error`;
  }
}

/* button handlers */
document.getElementById('backBtn').onclick = async ()=>{ t = addHours(t, -STEP_HOURS); await refreshAll(); };
document.getElementById('fwdBtn').onclick  = async ()=>{ t = addHours(t,  STEP_HOURS); await refreshAll(); };

document.getElementById("layer_temp").addEventListener("change", refreshAll);
document.getElementById("layer_alerts").addEventListener("change", refreshAll);
document.getElementById("layer_obsradar").addEventListener("change", refreshAll);

/* particles day controls are placeholders (kept for your UI); wire later */
document.getElementById('dayBackBtn').onclick = ()=>{ dayLabel.textContent = "Apr 13"; };
document.getElementById('dayFwdBtn').onclick  = ()=>{ dayLabel.textContent = "Apr 15"; };

refreshAll();
</script>
</body>
</html>
