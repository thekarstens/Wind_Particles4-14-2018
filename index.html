<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>April 2018 Case Study – Radar + Alerts + Story</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./leaflet.css"/>
<script src="./leaflet.js"></script>

<style>
html, body { height:100%; margin:0; }
#map { height:100%; background:#fff; }

.tvbanner{
  position:absolute; top:0; left:0; right:0;
  z-index:99999;
  background:rgba(11,28,45,0.94);
  color:#fff;
  border-bottom:2px solid rgba(255,255,255,0.12);
}
.banner-inner{
  height:78px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 14px;
  font-family: Arial, sans-serif;
  text-transform:uppercase;
}

#brandLogo{
  position:absolute;
  bottom:36px;
  right:18px;
  width:210px;
  pointer-events:none;
}

.story-btn{font-size:15px;font-weight:900;padding:10px 14px}
.leg-bar{
  width:120px;height:10px;border-radius:6px;
  background:linear-gradient(90deg,#2b83ba,#ffd166,#ef476f);
}

#storyPanel{
  position:absolute;top:96px;left:10px;
  width:360px;background:#fff;border-radius:14px;
  padding:12px;transform:translateX(-110%);
  transition:.2s;
}
#storyPanel.story-open{transform:translateX(0)}
</style>
</head>

<body>
<div id="map"></div>

<div class="tvbanner">
  <div class="banner-inner">
    <div>
      <div style="font-weight:900;font-size:22px">Lesson 1: Driving Question</div>
      <div style="font-size:12px">How can we use real-time weather data to make safer decisions?</div>
    </div>
    <div style="flex:1;text-align:center">
      <button id="bBackBtn">◀</button>
      <span id="bannerTimeLabel">April 14, 2018 7AM</span>
      <button id="bFwdBtn">▶</button>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <span>Light</span><div class="leg-bar"></div><span>Heavy</span>
      <input id="radarOpacity" type="range" min="0" max="100" value="70"/>
      <div style="font-size:32px;font-weight:900">RADAR</div>
      <button class="story-btn" id="storyToggleBtn">BEGIN STORY</button>
    </div>
  </div>
</div>

<div id="storyPanel">
  <h3>Storm Story</h3>
  <p>Story content loads from Google Sheets.</p>
</div>

<img id="brandLogo" src="./logo.png"/>

<script>
var map=L.map("map").setView([43.55,-96.73],6);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
{attribution:"© OSM"}).addTo(map);

var radar=null,opacity=0.7;
function drawRadar(){
 if(radar) map.removeLayer(radar);
 radar=L.imageOverlay("radar_frames/n0q_201804141200.png",[[24,-126],[50,-66]],{opacity:opacity}).addTo(map);
}
drawRadar();

document.getElementById("radarOpacity").oninput=e=>{
 opacity=e.target.value/100;
 if(radar) radar.setOpacity(opacity);
};

var alerts=L.geoJSON(null,{style:{color:"#d81b60",weight:2,fillOpacity:.25}}).addTo(map);
fetch("timeline_hourly/alerts_20180414_1200Z.geojson")
 .then(r=>r.json()).then(g=>alerts.addData(g));

document.getElementById("storyToggleBtn").onclick=()=>{
 document.getElementById("storyPanel").classList.toggle("story-open");
};
</script>
</body>
</html>
